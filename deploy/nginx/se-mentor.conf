server_tokens off;

upstream se_mentor_frontend {
    server frontend:8080;
}

upstream se_mentor_backend {
    server backend:8000;
}

server {
    listen 8080;
    server_name _;

    include /etc/nginx/se-mentor-locations.conf;
}

# HTTPS is enabled during deployment by mounting external certificate files and
# adding a TLS server block. Do not commit certificates or private keys.
# Expected mount paths:
#   /etc/nginx/certs/fullchain.pem
#   /etc/nginx/certs/privkey.pem
