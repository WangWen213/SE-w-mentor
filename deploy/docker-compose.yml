services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: se-mentor-backend:t107
    environment:
      SE_MENTOR_RUNTIME_PROFILE: CLOUD_DEMO
      SE_MENTOR_RUNTIME_ROOT: /var/lib/se-mentor
      SE_MENTOR_DEMO_RUNTIME_ROOT: /var/lib/se-mentor
      SE_MENTOR_DEMO_WORKSPACE: /var/lib/se-mentor/demo-workspace
      SE_MENTOR_DATABASE_URL: sqlite:////var/lib/se-mentor/se_mentor_api.sqlite3
      SE_MENTOR_HOST: 0.0.0.0
      SE_MENTOR_PORT: "8000"
    ports:
      - "127.0.0.1:${SE_MENTOR_BACKEND_PORT:-8000}:8000"
    volumes:
      - se_mentor_runtime:/var/lib/se-mentor
    networks:
      - se_mentor_internal
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2).read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    image: se-mentor-frontend:t107
    ports:
      - "127.0.0.1:${SE_MENTOR_FRONTEND_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - se_mentor_internal
    restart: unless-stopped

networks:
  se_mentor_internal:
    driver: bridge

volumes:
  se_mentor_runtime:
