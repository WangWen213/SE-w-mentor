services:
  backend:
    environment:
      SE_MENTOR_RUNTIME_PROFILE: "${SE_MENTOR_RUNTIME_PROFILE:-CLOUD_DEMO}"
      SE_MENTOR_TRUST_PROXY: "${SE_MENTOR_TRUST_PROXY:-false}"
    ports: !override []

  frontend:
    ports: !override []

  gateway:
    volumes: !override
      - ./nginx/se-mentor-https.template.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/snippets/se-mentor-locations.conf:/etc/nginx/se-mentor-locations.conf:ro
      - "${SE_MENTOR_TLS_CERT_DIR:-./certs}:/etc/nginx/certs:ro"
      - "${SE_MENTOR_ACME_WEBROOT:-./acme-webroot}:/var/www/acme:ro"
    ports: !override
      - "${SE_MENTOR_PUBLIC_HTTP_PORT:-80}:8080"
      - "${SE_MENTOR_PUBLIC_HTTPS_PORT:-443}:8443"
