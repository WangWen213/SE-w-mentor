name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-quality:
    name: Backend Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "backend[dev]"
      - name: Ruff format
        run: python -m ruff format --check backend scripts tests
      - name: Ruff check
        run: python -m ruff check backend scripts tests
      - name: Mypy production-critical paths
        working-directory: backend
        run: |
          python -m mypy \
            src/se_mentor/paths.py \
            src/se_mentor/policy/grants.py \
            src/se_mentor/policy/compiler.py \
            src/se_mentor/policy/enforcer.py \
            src/se_mentor/tools/create_file.py \
            src/se_mentor/tools/apply_patch.py \
            src/se_mentor/tools/delete_file.py

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "backend[dev]"
      - name: Migration policy
        run: python scripts/ci/check_migrations.py
      - name: Backend core release tests
        working-directory: backend
        run: |
          python -m pytest \
            tests/policy/test_grants.py \
            tests/policy/test_compiler.py \
            tests/policy/test_enforcer.py \
            tests/policy/test_policy_regression_scoped_action.py \
            tests/tools/test_create_file.py \
            tests/tools/test_apply_patch.py \
            tests/tools/test_delete_file.py \
            tests/transactions/test_recovery.py \
            tests/api/test_real_execution_recovery.py::test_execution_without_real_file_change_fails_terminally
      - name: ONLINE_SAFE release security tests
        working-directory: backend
        run: |
          python -m pytest \
            tests/security/test_online_workspaces.py \
            tests/security/test_online_domain_isolation.py::test_online_safe_domain_state_is_isolated_by_project_owner_hash \
            tests/security/test_online_execution_readiness.py \
            tests/security/test_online_provider_security.py \
            tests/security/test_runtime_profiles.py
      - name: P0 real create-file acceptance
        run: python scripts/accept_online_safe_create_file_e2e.py
      - name: Mock-safe E2E
        run: python scripts/ci/run_mock_e2e.py

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Type check
        run: npm run type-check
      - name: Frontend tests
        run: npm run test -- --run
      - name: Frontend production build
        run: npm run build

  security-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Scan tracked files
        run: python scripts/ci/scan_secrets.py

  release-gate:
    name: Release Gate
    runs-on: ubuntu-latest
    needs:
      - backend-quality
      - backend-tests
      - frontend-tests
      - security-scan
    steps:
      - name: Validate release gate inputs
        run: |
          test -n "${GITHUB_SHA}"
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            test "${GITHUB_REF_NAME}" = "main"
          fi
          echo "CI release gate passed for ${GITHUB_SHA}."
